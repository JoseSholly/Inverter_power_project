[project]
name = "inverter-power-project"
version = "2.0.0"
description = "Inverter, battery and solar panel sizing API built on Django and django-bolt"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-bolt>=0.11.1",
    "django-jazzmin>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "requests>=2.34.2",
]

[tool.uv]
package = false
